name: Build binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: compute
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          new="v${major}.${minor}.$((patch + 1))"

          git config user.name "Lahiru S Liyanage"
          git config user.email "liyanagelsofficial@gmail.com"
          git tag "$new"
          git push origin "$new"

          echo "version=$new" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          OUT="dist/smtp-tester-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "$OUT" .
          echo "BIN_PATH=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: smtp-tester-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN_PATH }}

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.version }}
          name: ${{ needs.bump-version.outputs.version }}
          prerelease: false
          make_latest: true
          files: dist/*

  release-latest:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: false
          files: dist/*

  publish-latest:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Commit binaries to bin/ for raw URL access
        run: |
          git config user.name "Lahiru S Liyanage"
          git config user.email "liyanagelsofficial@gmail.com"
          mkdir -p bin
          cp dist/* bin/
          git add bin
          if ! git diff --cached --quiet; then
            git commit -m "chore: update prebuilt binaries [skip ci]"
            git push origin main
          else
            echo "No binary changes to commit."
          fi
